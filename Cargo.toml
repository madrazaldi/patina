[workspace]
resolver = "3"
members = ["crates/plex", "crates/mpv", "crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/madrazaldi/patina"

[workspace.dependencies]
patina-plex = { path = "crates/plex" }
patina-mpv = { path = "crates/mpv" }
patina-core = { path = "crates/core" }
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "stream", "query", "form", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
