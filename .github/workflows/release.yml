name: Release

# Push a tag matching the workspace version (e.g. `v0.2.0` for version = "0.2.0") to build
# the Electrobun desktop app and patina-tui for every platform into a draft GitHub release.
# `tools/release.sh 0.2.0` bumps the version, commits and tags. Review the draft, then publish
# it by hand. Tags with a pre-release suffix (`v0.2.0-rc.1`) are marked as pre-releases.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

      - id: create
        name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Patina $GITHUB_REF_NAME" \
            -F draft=true -F prerelease=$prerelease -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # The Electrobun desktop app (the Bun backend is bundled in; no Rust involved).
  desktop:
    name: Desktop (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:app

      - name: Upload the artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Electrobun writes the installers and update archives to artifacts/.
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            name="Patina-$GITHUB_REF_NAME-${{ matrix.target }}-$(basename "$f")"
            cp "$f" "$name"
            gh release upload "$GITHUB_REF_NAME" "$name" --clobber
          done

  tui:
    name: patina-tui (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "macos-latest", target: aarch64-apple-darwin }
          - { os: "macos-latest", target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p patina-tui --target ${{ matrix.target }}

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="patina-tui-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/patina-tui.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/patina-tui" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber

  checksums:
    name: Checksums
    needs: [desktop, tui]
    runs-on: ubuntu-24.04
    steps:
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" SHA256SUMS --clobber
