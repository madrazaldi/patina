name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # The Rust crates: patina-tui (plex, mpv, core, tui) and the native desktop app (desktop, on GPUI).
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 26.04 for mpv 0.38+ (the smoke test needs the newer loadfile signature).
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # mpv and ffmpeg for the playback tests, the rest for GPUI (crates/desktop).
          sudo apt-get install -y libssl-dev mpv ffmpeg \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1

      # Self-hosted runners keep target/ between runs.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      # The integration tests start tools/mock_pms.py with `python3`, which Windows runners don't provide.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked

      - name: Test (unit only)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked --lib --bins

      - name: mpv playback tests
        if: runner.os == 'Linux'
        run: cargo test -p patina-core --test reliability --locked -- --ignored --test-threads=1 mpv_

  # Single required check for branch protection.
  ok:
    name: CI OK
    if: always()
    needs: [rust]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
