name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 26.04 for mpv 0.38+ (the smoke test needs the newer loadfile signature).
        # Set the MACOS_RUNNER repo variable (e.g. patina-mac) to use a self-hosted Mac.
        os: [ubuntu-26.04, "${{ vars.MACOS_RUNNER || 'macos-latest' }}", windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev mpv ffmpeg

      # Self-hosted runners keep target/ between runs.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-on-failure: true

      # tauri::generate_context! needs frontendDist to exist; the Rust jobs don't need the real bundle.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p dist

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      # The integration tests start tools/mock_pms.py with `python3`, which Windows runners don't provide.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked

      - name: Test (unit only)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked --lib --bins

      - name: mpv playback smoke test
        if: runner.os == 'Linux'
        run: cargo test -p patina-core --test reliability --locked -- --ignored mpv_playback_smoke

  # The native macOS app (macos/): builds the backend library and the SwiftUI app.
  macos:
    name: macOS app
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          key: macos-app
          cache-on-failure: true

      - name: Build
        run: macos/build.sh

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm test
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Single required check for branch protection.
  ok:
    name: CI OK
    if: always()
    needs: [rust, macos, web]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
