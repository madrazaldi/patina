name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # The Rust crates behind patina-tui (plex, mpv, core, tui).
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 26.04 for mpv 0.38+ (the smoke test needs the newer loadfile signature).
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev mpv ffmpeg

      # Self-hosted runners keep target/ between runs.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      # The integration tests start tools/mock_pms.py with `python3`, which Windows runners don't provide.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked

      - name: Test (unit only)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked --lib --bins

      - name: mpv playback tests
        if: runner.os == 'Linux'
        run: cargo test -p patina-core --test reliability --locked -- --ignored --test-threads=1 mpv_

  # The desktop app: Svelte webview (web/) and the TypeScript backend (desktop/) on Electrobun.
  web:
    name: Web and desktop backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install mpv and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv ffmpeg

      - run: bun install --frozen-lockfile

      - name: Type-check (web and desktop)
        run: bun run check

      - name: Backend tests
        run: bun run test:desktop
        env:
          # The tests that start mpv run headless (--vo=null --ao=null).
          PATINA_MPV_TESTS: "1"

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Playwright
        run: bun run test
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The Electrobun app builds on every platform (the bundle isn't published here).
  app:
    name: App bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build the app
        run: bun run build:app

  # Single required check for branch protection.
  ok:
    name: CI OK
    if: always()
    needs: [rust, web, app]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
